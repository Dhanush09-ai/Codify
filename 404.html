<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codify - Loading Lesson...</title>
    <style>
        body { background-color: #0a0f1c; color: #fff; font-family: 'Nunito', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { text-align: center; }
    </style>
</head>
<body>
    <div class="loader">
        <h2>Loading your lesson...</h2>
        <p style="color: #94a3b8;">Please wait while Codify prepares your workspace.</p>
    </div>

    <script>
    (async function() {
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        // Example path: ['courses', 'cpp', '1.2']
        
        if (pathSegments.length >= 3 && pathSegments[0] === 'courses') {
            const track = pathSegments[1]; // e.g., 'cpp'
            const lessonNum = pathSegments[2]; // e.g., '1.2'

            try {
                // Fetch the track syllabus JSON to find the exact markdown filename
                const res = await fetch(`/src/data/${track}-syllabus.json`);
                if (!res.ok) throw new Error("Syllabus not found");
                const syllabus = await res.json();

                let foundFile = null;
                for (const chapter of syllabus.chapters) {
                    const match = chapter.topics.find(topic => topic.file.includes(lessonNum));
                    if (match) {
                        foundFile = match.file;
                        break;
                    }
                }

                const matchedFile = foundFile || `chapter-1/${lessonNum}.md`;
                const targetUrl = `/src/pages/courses/course-lesson.html?course=${track}&file=${encodeURIComponent(matchedFile)}`;
                
                // Fetch and render the actual lesson template smoothly
                const lessonRes = await fetch(targetUrl);
                if (!lessonRes.ok) throw new Error("Lesson template not found");
                const html = await lessonRes.text();

                document.open();
                document.write(html);
                document.close();
            } catch (err) {
                console.error("Routing error:", err);
                document.querySelector('.loader').innerHTML = `<h2>Lesson Not Found</h2><p>We couldn't locate this lesson path.</p><a href="/src/pages/courses.html" style="color: #00aaff;">Back to Courses</a>`;
            }
        } else {
            // If it's a genuine 404 on some other page, show a friendly message
            document.querySelector('.loader').innerHTML = `<h2>Page Not Found</h2><p>The page you are looking for doesn't exist.</p><a href="/" style="color: #00aaff;">Go Home</a>`;
        }
    })();
    </script>
</body>
</html>
