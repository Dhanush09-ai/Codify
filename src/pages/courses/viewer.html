<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Codify - Lesson Viewer</title>
    <link rel="stylesheet" href="/src/styles/main.css"> <!-- Adjust path as needed -->
</head>
<body>
    <div class="page-wrapper">
        <main class="content-container">
            <h1 id="lessonTitle">Loading lesson...</h1>
            <div id="lessonContent">Please wait while we fetch your content.</div>
        </main> 
    </div>

    <script type="module">
        async function initLessonViewer() {
            // Parse path segments like /courses/c/1.1
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            // pathSegments will be ['courses', 'c', '1.1']
            
            if (pathSegments.length >= 3 && pathSegments[0] === 'courses') {
                const track = pathSegments[1]; // e.g., 'c'
                const lessonId = pathSegments[2]; // e.g., '1.1'

                try {
                    // Map the clean URL parameters to your actual file structure or data
                    // For example, mapping '1.1' to chapter-1/1.1-what-is-programming-and-c.md
                    const markdownFile = `chapter-1/${lessonId}-what-is-programming-and-c.md`;
                    
                    // Fetch your markdown content or syllabus JSON data dynamically
                    document.getElementById('lessonTitle').textContent = `Track: ${track.toUpperCase()} - Lesson ${lessonId}`;
                    
                    // Example fetch request to your markdown/content pipeline
                    const response = await fetch(`/src/data/courses/${track}/${markdownFile}`);
                    if (response.ok) {
                        const markdownText = await response.text();
                        document.getElementById('lessonContent').innerHTML = `<pre>${markdownText}</pre>`;
                    } else {
                        document.getElementById('lessonContent').textContent = "Lesson content not found.";
                    }
                } catch (err) {
                    console.error("Error loading lesson:", err);
                    document.getElementById('lessonContent').textContent = "Failed to load lesson content.";
                }
            } else {
                document.getElementById('lessonTitle').textContent = "Invalid URL";
                document.getElementById('lessonContent').textContent = "The requested course path is malformed.";
            }
        }

        document.addEventListener('DOMContentLoaded', initLessonViewer);
    </script>
</body>
</html>
