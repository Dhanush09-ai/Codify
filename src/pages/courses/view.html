<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codify - Course Viewer</title>
</head>
<body>
    <div id="appContainer" style="color: #fff; padding: 40px; font-family: sans-serif;">Loading lesson content...</div>

<script>
(async function() {
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    
    // Checks if path is structured like /courses/cpp/1.2
    if (pathSegments.length >= 3 && pathSegments[0] === 'courses') {
        const track = pathSegments[1]; 
        const lessonNum = pathSegments[2]; 

        const urlParams = new URLSearchParams(window.location.search);
        if (!urlParams.has('file')) {
            try {
                // Fetch the track's syllabus JSON to find the matching markdown file
                const res = await fetch(`/src/data/${track}-syllabus.json`);
                if (!res.ok) throw new Error("Syllabus not found");
                const syllabus = await res.json();

                let foundFile = null;
                for (const chapter of syllabus.chapters) {
                    const match = chapter.topics.find(topic => topic.file.includes(lessonNum));
                    if (match) {
                        foundFile = match.file;
                        break;
                    }
                }

                const matchedFile = foundFile || `chapter-1/${lessonNum}.md`;
                
                // Silently inject the query parameters into the history so your existing 
                // script reads ?course=cpp&file=... without a redirect flicker
                const newQuery = `?course=${track}&file=${encodeURIComponent(matchedFile)}`;
                window.history.replaceState({}, '', window.location.pathname + newQuery);

            } catch (err) {
                console.error("Auto-routing error:", err);
            }
        }
    }
})();
</script>
</body>
</html>
