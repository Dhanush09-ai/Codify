<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codify - Course Viewer</title>
</head>
<body>
    <div id="appContainer" style="color: #fff; padding: 40px; font-family: sans-serif;">Loading lesson content...</div>

    <script>
(function() {
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    
    if (pathSegments.length >= 3 && pathSegments[0] === 'courses') {
        const track = pathSegments[1]; // e.g., 'html'
        const lessonNum = pathSegments[2]; // e.g., '1.1'

        // Automatically fetch the track's syllabus JSON to find the correct file path
        fetch(`/src/data/${track}-syllabus.json`)
            .then(res => res.json())
            .then(syllabus => {
                let foundFile = null;

                // Search through chapters and topics to match the lesson number/id
                for (const chapter of syllabus.chapters) {
                    const match = chapter.topics.find(topic => {
                        // Extracts ID or matches filename prefix (e.g., "1.1")
                        return topic.file.includes(lessonNum);
                    });
                    if (match) {
                        foundFile = match.file;
                        break;
                    }
                }

                // Fallback if not found in JSON
                const matchedFile = foundFile || `chapter-1/${lessonNum}.md`;
                const targetUrl = `/src/pages/courses/course-lesson.html?course=${track}&file=${encodeURIComponent(matchedFile)}`;
                
                return fetch(targetUrl);
            })
            .then(response => response.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(err => {
                console.error("Error loading lesson route:", err);
            });
    }
})();
</script>
</body>
</html>
